<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>雷电防护装置检测标识 - 教学示例</title>
<style>

:root{
  /* Editable layout parameters (desktop 1792px reference) */
  --layout-width:1088px; --layout-shift:-16px;
  --left-width:520px; --right-width:528px; --column-gap:40px;
  --title-size:29px; --body-size:16px; --label-line-height:32px;
  --frame-border:#777; --frame-height:516px; --qr-size:106px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:#fff;color:#000;font-family:"SimSun","Songti SC","Noto Serif CJK SC",serif;font-size:var(--body-size)}
.page{width:100%;margin:auto;padding:12px 14px 50px}
h1{text-align:center;font-family:"SimHei","Microsoft YaHei",sans-serif;font-size:var(--title-size);font-weight:700;line-height:1.48;margin:0 0 18px}
.columns{width:var(--layout-width);max-width:100%;margin:0 auto;position:relative;left:var(--layout-shift);display:grid;grid-template-columns:var(--left-width) var(--right-width);gap:var(--column-gap);align-items:start}
.left{padding-top:0;min-width:0}
.label-row{line-height:var(--label-line-height);min-height:var(--label-line-height);font-weight:600;overflow-wrap:anywhere}
.qr{display:block;width:var(--qr-size);height:var(--qr-size);margin:4px 0 26px 8px;object-fit:contain}
.remark{font-size:14px;line-height:1.65;font-weight:600;white-space:normal}
.right{border:1px solid var(--frame-border);min-height:var(--frame-height)}
.frame-header{height:66px;border-bottom:1px solid var(--frame-border);display:flex;align-items:center;justify-content:center;font-weight:600}
.frame-body{padding:7px 9px 11px;font-weight:500}
.intro{line-height:47px;text-indent:1.15em;margin:0;min-height:108px}
.detail{margin:7px 0 0 58px;line-height:42px}
.detail.first{margin-top:7px}
.under{text-decoration:underline;text-underline-offset:3px}
.signed{text-align:right;padding-right:48px;line-height:40px;margin:10px 0 0}
.next{line-height:43px;margin:0}
.contact{line-height:46px;margin:0}
.example{width:max-content;max-width:95%;font-family:"Microsoft YaHei",sans-serif;font-size:11px;color:#666;text-align:center;margin:7px auto 0}
@media(max-width:1150px){.columns{left:0;width:100%;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}.detail{margin-left:28px}}
@media(max-width:700px){:root{--title-size:23px;--body-size:14px;--label-line-height:30px;--qr-size:106px}.page{padding:13px 15px 34px}h1{margin-bottom:17px}.columns{display:block}.right{margin-top:26px;min-height:0}.frame-header{height:58px}.frame-body{padding:7px 10px}.intro{line-height:2.2;min-height:0}.detail,.detail.first{margin:7px 0 0 14px;line-height:3}.signed{padding-right:10px}.next,.contact{line-height:2.7}.remark{font-size:12px}}
</style>
</head>
<body>
<div class="page">
  <h1 id="pageTitle"></h1>
  <main class="columns">
    <section class="left">
      <div class="label-row" id="project"></div>
      <div class="label-row" id="address"></div>
      <div class="label-row" id="owner"></div>
      <div class="label-row" id="region"></div>
      <div class="label-row" id="registered"></div>
      <img class="qr" src="qrcode.png" alt="教学二维码示例">
      <div class="remark" id="remark"></div>
    </section>
    <section class="right">
      <div class="frame-header" id="frameTitle"></div>
      <div class="frame-body">
        <p class="intro" id="intro"></p>
        <div class="detail first" id="lab"></div>
        <div class="detail" id="license"></div>
        <div class="detail" id="inspectors"></div>
        <div class="signed" id="signed"></div>
        <div class="next" id="next"></div>
        <p class="contact" id="phone"></p>
        <p class="contact" id="complaint"></p>
      </div>
    </section>
  </main>
  <div class="example">教学示例 · 非官方检测凭证</div>
</div>
<script>
/* ====================================================
 * 只需修改下面的 DATA 字段，以及同目录 qrcode.png 图片。
 * 调整页面尺寸：修改上方 :root 中的 CSS 变量。
 * 以下全部为虚构的教学用示例信息。
 * ==================================================== */
const DATA = {
  pageTitle: '广东省雷电防护装置检测标识',
  projectName: '示例文化设施建设项目一期',
  projectAddress: '示例市示例区文化路88号',
  ownerName: '示例文化发展有限公司',
  region: '',
  registeredDate: '2026年06月30日',
  remark: '备注：本页为网页排版教学示例，不代表任何机构出具的检测证明。',
  frameTitle: '雷电防护装置检测登记（教学示例）',
  inspectionYear: '2026', inspectionMonth: '06', inspectionDay: '22',
  labName: '示例防雷科技有限公司',
  licenseNumber: 'DEMO-2026-0001',
  inspectorNames: '张某某，李某某',
  nextYear: '2027', nextMonth: '06', nextDay: '22',
  phone: '000-00000000', complaintPhone: '000-00000000'
};
const $=id=>document.getElementById(id);
const t=(id,value)=>$(id).textContent=value;
const u=s=>{const e=document.createElement('span');e.className='under';e.textContent=s;return e};
function withUnderline(id,prefix,value){const e=$(id);e.textContent=prefix;e.appendChild(u(value));}
t('pageTitle',DATA.pageTitle);
t('project','被检项目名称: '+DATA.projectName);
t('address','被检项目地址: '+DATA.projectAddress);
t('owner','被检单位名称: '+DATA.ownerName);
t('region','登记区域: '+DATA.region);
t('registered','登记日期: '+DATA.registeredDate);
t('remark',DATA.remark);
t('frameTitle',DATA.frameTitle);
const intro=$('intro');intro.append('经 ',u(DATA.inspectionYear),' 年 ',u(DATA.inspectionMonth),' 月 ',u(DATA.inspectionDay),' 日检测，我单位承诺检测报告书所列雷电防护装置，符合国家有关雷电防护标准和国务院气象主管机构规定的使用要求。');
withUnderline('lab','检测单位（盖章）：',DATA.labName);
t('license','检测单位资质证号：'+DATA.licenseNumber);
t('inspectors','检测人员：'+DATA.inspectorNames);
const signed=$('signed');signed.append(u(DATA.inspectionYear),'　年 ',u(DATA.inspectionMonth),' 月 ',u(DATA.inspectionDay),' 日');
const next=$('next');next.append('提示：下次检测日期为 ',u(DATA.nextYear),' 年 ',u(DATA.nextMonth),' 月 ',u(DATA.nextDay),' 日前。');
t('phone','检测单位联系电话：'+DATA.phone);
t('complaint','咨询电话：'+DATA.complaintPhone);
</script>
</body>
</html>
